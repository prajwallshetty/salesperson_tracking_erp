<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bharath Interior Decor — offline</title>
    <script src="app-config.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #000000; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { font-size: 14px; color: rgba(255,255,255,.75); max-width: 320px; line-height: 1.45; margin: 0 0 8px; }
      button { margin-top: 20px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #D4AF37; color: #000000; font-size: 15px; font-weight: 700; }
      .status { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 14px; }
    </style>
  </head>
  <body>
    <main>
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" aria-hidden="true"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="M12 20h.01"/></svg>
      <h1>Can't reach Bharath Interior Decor</h1>
      <p>Check your mobile data or Wi-Fi. Bharath Interior Decor needs a connection to open.</p>
      <p>Once it is open, orders, collections and expenses you record offline are kept on the phone and sync automatically.</p>
      <button id="retry" type="button">Try again</button>
      <div class="status" id="status" role="status"></div>
    </main>
    <script>
      var target = window.SALESGRID_SERVER_URL;
      function retry() {
        document.getElementById('status').textContent = 'Connecting…';
        if (target) window.location.replace(target);
        else document.getElementById('status').textContent = 'App is not configured with a server address.';
      }
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', retry);
    </script>
  </body>
</html>
