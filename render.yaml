# SalesGrid — one web service (UI + API + realtime) and one PostgreSQL database.
# Replaces the three legacy services (salesperson-erp-api, -admin, -app).
services:
  - type: web
    name: salesgrid
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    # Forward-only migrations; existing `db push` databases must be baselined once (see docs/DEPLOYMENT.md).
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    # Socket.IO and the in-memory rate limiter assume ONE instance (see docs/DEPLOYMENT.md before scaling).
    numInstances: 1
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: salesgrid-db
          property: connectionString
      - key: JWT_SECRET
        sync: false # reuse the legacy API's JWT_SECRET so existing sessions stay valid
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: NEXT_PUBLIC_DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        sync: false # optional: only for cross-origin API clients

databases:
  - name: salesgrid-db
    plan: basic-256mb
