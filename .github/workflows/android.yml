name: Android APK

# Builds the SalesGrid Android shell (apps/mobile). The APK loads the deployed web app from
# SALESGRID_SERVER_URL, so it only needs rebuilding for native changes (see docs/MOBILE_ANDROID.md).
#
# Repository settings used:
#   Variables: SALESGRID_SERVER_URL (https URL of the deployed SalesGrid server)
#   Secrets (optional, for a signed release APK): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#            ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without SALESGRID_SERVER_URL the workflow only checks that the project compiles and publishes nothing.

on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'SalesGrid server URL (https://…); defaults to the SALESGRID_SERVER_URL variable'
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    env:
      SALESGRID_SERVER_URL: ${{ inputs.server_url || vars.SALESGRID_SERVER_URL }}
      SALESGRID_VERSION_CODE: ${{ github.run_number }}
      SALESGRID_VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); add the API level this project targets.
      - name: Android SDK packages
        working-directory: .
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - run: npm ci

      - name: Server URL
        run: |
          if [ -z "$SALESGRID_SERVER_URL" ]; then
            echo "::warning::SALESGRID_SERVER_URL is not set: compile check only, no APK is published."
            echo "SALESGRID_SERVER_URL=https://salesgrid.invalid" >> "$GITHUB_ENV"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Sync web config and plugins
        run: npm run sync

      - name: Debug APK (signed with the Android debug key, for testing)
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Release APK (signed)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SALESGRID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SALESGRID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SALESGRID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SALESGRID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload debug APK
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: salesgrid-debug-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload signed release APK
        if: env.PUBLISH == 'true' && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: salesgrid-release-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
